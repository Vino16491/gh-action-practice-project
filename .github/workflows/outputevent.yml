name: output issues information
on: workflow_dispatch
jobs:
    fullinfo:
        runs-on: ubuntu-latest
        steps:
            - name: Output GitHub Context
              run: echo "${{ toJson(github) }}"
    issue-details:
        runs-on: ubuntu-latest
        steps:
            - name: GitHub Issue Context
              run: echo "${{ toJson(github.event.workflow)}}" 